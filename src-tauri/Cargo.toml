[package]
name = "snip-ans"
version = "0.1.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snip_ans_lib"
# 只用 rlib：桌面应用只需 bin，额外的 cdylib/staticlib 会在 target 下
# 生成一份 37MB 的 snip_ans_lib.dll，被安装包一并收进去，白白让 MSI 翻倍。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", features = ["json"] }
global-hotkey = "0.7.0"
screenshots = "0.8.10"
arboard = "3.6.1"
base64 = "0.22.1"
image = "0.25.9"

# 悬浮窗隐身：WS_EX_NOACTIVATE / WS_EX_TOOLWINDOW / WDA_EXCLUDEFROMCAPTURE。
# 这些能力 tauri/tao 没有暴露，只能直接调 Win32。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# 仅测试用：驱动 fetch_models 这类异步函数的 #[tokio::test]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

