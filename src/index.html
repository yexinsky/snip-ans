<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnipAns Settings</title>
  <style>
    :root {
      font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
      color-scheme: light dark;
      color: rgba(255, 255, 255, 0.87);
      background-color: #242424;
    }

    body {
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 1.5em;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: bold;
      font-size: 0.9em;
      color: #aaa;
    }

    input,
    select,
    textarea {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #333;
      color: white;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      padding: 10px 20px;
      background-color: #646cff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      align-self: flex-end;
    }

    button:hover {
      background-color: #535bf2;
    }

    #status {
      font-size: 0.9em;
      color: #888;
      text-align: right;
    }
  </style>
</head>

<body>
  <h1>SnipAns Configuration</h1>

  <div class="field">
    <label for="api_protocol">API Protocol</label>
    <select id="api_protocol">
      <option value="openai">OpenAI Compatible (Default)</option>
      <option value="gemini">Google Gemini Native</option>
    </select>
  </div>

  <div class="field">
    <label for="api_key">API Key</label>
    <input type="password" id="api_key" placeholder="sk-..." />
  </div>

  <div class="field">
    <label for="api_endpoint">API Endpoint</label>
    <input type="text" id="api_endpoint" placeholder="https://api.openai.com/v1/chat/completions" />
  </div>

  <div class="field">
    <label for="model_name">Model Name</label>
    <input type="text" id="model_name" placeholder="gpt-4o" />
  </div>

  <div class="field">
    <label for="hotkey">Screenshot Hotkey (Cache Image)</label>
    <input type="text" id="hotkey" placeholder="Ctrl+Alt+S" />
    <small style="color:#666">Takes a screenshot and caches it (Max 8). Requires restart</small>
  </div>

  <div class="field">
    <label for="send_key">Send Hotkey (Process All)</label>
    <input type="text" id="send_key" placeholder="Ctrl+Alt+Enter" />
    <small style="color:#666">Sends all cached images to AI. Requires restart</small>
  </div>

  <div class="field">
    <label for="boss_key">Boss Key (Toggle Overlay)</label>
    <input type="text" id="boss_key" placeholder="Ctrl+Shift+H" />
    <small style="color:#666">Quickly hide/show overlay. Requires restart to apply</small>
  </div>

  <div class="field">
    <label for="output_mode">Output Mode</label>
    <select id="output_mode">
      <option value="overlay">Overlay Window</option>
      <option value="clipboard">Clipboard Only</option>
      <option value="both">Both (Overlay + Clipboard)</option>
    </select>
  </div>

  <div class="field">
    <label for="overlay_style">Overlay Style</label>
    <select id="overlay_style">
      <option value="normal">Normal (Dark Background)</option>
      <option value="stealth">Stealth (Transparent, Black Text)</option>
    </select>
  </div>

  <div class="field">
    <label for="font_size">Font Size (px)</label>
    <input type="number" id="font_size" min="10" max="32" value="14" />
    <small style="color:#666">Overlay text size (10-32px)</small>
  </div>

  <div class="field">
    <label for="prompt">System Prompt</label>
    <textarea id="prompt"></textarea>
  </div>

  <div class="field">
    <label>Logs</label>
    <div id="logs"
      style="background:#111; padding:8px; height:100px; overflow-y:auto; font-family:monospace; font-size:12px; border:1px solid #444; border-radius:4px;">
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <span id="status"></span>
    <button id="save">Save Settings</button>
  </div>

  <script src="main.js"></script>
</body>

</html>
